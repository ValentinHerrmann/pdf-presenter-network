<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDF Presenter</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <!--PDF_PRESENTER_CONFIG-->
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
        background: #0d1117; color: #e6edf3;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
      .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      .subtitle { font-size: 13px; color: #8b949e; margin-bottom: 24px; }
      .pdf-list { display: flex; flex-direction: column; gap: 8px; }
      .pdf-card {
        display: flex; align-items: center; gap: 16px;
        background: #161b22; border: 1px solid #21262d; border-radius: 8px;
        padding: 14px 18px; transition: border-color 0.15s;
      }
      .pdf-card:hover { border-color: #388bfd44; }
      .pdf-name {
        flex: 1; min-width: 0; font-size: 14px; font-weight: 500;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .badge {
        font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 12px;
        white-space: nowrap; flex-shrink: 0;
      }
      .badge-ready { background: #238636; color: #fff; }
      .badge-partial { background: #9e6a03; color: #fff; }
      .badge-empty { background: #30363d; color: #8b949e; }
      .badge-none { background: #21262d; color: #484f58; }
      .slide-count { font-size: 11px; color: #8b949e; white-space: nowrap; flex-shrink: 0; }
      .actions { display: flex; gap: 6px; flex-shrink: 0; }
      .btn {
        appearance: none; background: #1d222a; color: #d7dbe3;
        border: 1px solid #2d333b; border-radius: 4px;
        padding: 6px 12px; font-size: 12px; font-family: inherit;
        cursor: pointer; text-decoration: none; transition: background 0.1s;
      }
      .btn:hover { background: #252b35; border-color: #3a4049; }
      .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      .btn-primary:hover { background: #388bfd; }
      .btn:disabled { opacity: 0.6; cursor: wait; }
      .header-actions { display: flex; gap: 8px; }
      .btn-update { background: #238636; border-color: #2ea043; color: #fff; }
      .btn-update:hover:not(:disabled) { background: #2ea043; }
      .hidden { display: none; }
      .badge-link { background: #1f3a5f; color: #79c0ff; }
      .pdf-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .pdf-source {
        font-size: 11px; color: #8b949e; text-decoration: none;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .pdf-source:hover { color: #58a6ff; text-decoration: underline; }
      .btn-remove:hover { background: #3d1d20; border-color: #f85149; color: #ffa198; }
      .dialog-hint { font-size: 12px; color: #8b949e; margin: 0 0 4px; line-height: 1.4; }
      dialog {
        background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px;
        padding: 20px; width: min(560px, calc(100vw - 32px));
      }
      dialog::backdrop { background: #0008; }
      dialog h2 { font-size: 16px; margin: 0 0 12px; }
      dialog label { display: block; font-size: 12px; color: #8b949e; margin: 10px 0 4px; }
      dialog input {
        width: 100%; background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
        border-radius: 4px; padding: 7px 9px; font: inherit; font-size: 13px;
      }
      .dialog-error { color: #f85149; font-size: 12px; min-height: 16px; margin-top: 10px; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
      .empty-state {
        text-align: center; padding: 64px 24px; color: #8b949e; font-size: 14px;
      }
      .loading { text-align: center; padding: 64px 24px; color: #8b949e; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>PDF Presenter</h1>
        <div class="header-actions">
          <button type="button" id="update-btn" class="btn btn-update hidden">Update</button>
          <button type="button" id="add-url" class="btn">Add URL</button>
          <button type="button" id="open-pdf" class="btn btn-primary">Open PDF</button>
        </div>
        <input type="file" id="open-pdf-input" accept="application/pdf,.pdf" hidden />
      </div>
      <div class="subtitle" id="dir-path"></div>
      <div id="list" class="pdf-list"><div class="loading">Loading...</div></div>
    </div>
    <dialog id="add-url-dialog">
      <form method="dialog" id="add-url-form">
        <h2>Add a PDF from a URL</h2>
        <p class="dialog-hint">
          Use a direct link to a PDF file that is publicly reachable. It is fetched again each
          time you open it, so the list always shows the latest version. If the site is
          unreachable, the last loaded copy is used.
        </p>
        <label for="add-url-url">URL</label>
        <input id="add-url-url" type="url" required placeholder="https://example.com/slides.pdf" />
        <label for="add-url-name">Name</label>
        <input id="add-url-name" required />
        <div class="dialog-error" id="add-url-error"></div>
        <div class="dialog-actions">
          <button type="button" class="btn" id="add-url-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="add-url-submit">Add</button>
        </div>
      </form>
    </dialog>
    <script type="module">
      import { initListing } from "/assets/listing.js";
      import { createUpdateButton } from "/assets/modules/update-check.js";
      initListing();
      createUpdateButton(document.getElementById("update-btn"));
    </script>
  </body>
</html>
