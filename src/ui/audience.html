<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audience</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/presenter.css" />
    <!--PDF_PRESENTER_CONFIG-->
  </head>
  <body class="audience">
    <div id="stage" class="stage">
      <div class="slide-stack">
        <canvas id="slide-canvas"></canvas>
        <canvas id="overlay-layer" class="overlay-layer"></canvas>
      </div>
      <div id="laser-dot" class="laser-dot hidden" aria-hidden="true"></div>
      <div id="black-overlay" class="overlay hidden"></div>
      <div id="freeze-indicator" class="freeze-indicator hidden">FROZEN</div>
      <div id="status" class="status"></div>
      <div id="audience-toolbar" class="audience-toolbar">
        <button type="button" id="fullscreen-btn" class="toolbar-btn">Full Screen</button>
        <button type="button" id="presenter-btn" class="toolbar-btn">Presenter Mode</button>
      </div>
    </div>
    <script type="module">
      import { initAudience } from "/assets/presenter.js";
      initAudience();
    </script>
  </body>
</html>
