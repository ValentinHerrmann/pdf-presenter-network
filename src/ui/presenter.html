<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Presenter</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-presenter.svg" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/presenter.css" />
    <!--PDF_PRESENTER_CONFIG-->
  </head>
  <body class="presenter">
    <div class="layout">
      <div class="col col-left notes-collapsed">
        <section class="current">
          <header class="panel-title">Current</header>
          <div class="canvas-wrap">
            <div class="slide-stack">
              <canvas id="current-canvas"></canvas>
              <div id="link-layer" class="link-layer" aria-hidden="true"></div>
              <canvas id="overlay-layer" class="overlay-layer"></canvas>
            </div>
          </div>
        </section>
        <div class="divider-row" id="divider-row-left" role="separator" aria-orientation="horizontal" aria-label="Resize left column rows"></div>
        <section class="notes notes-hidden" id="notes-panel">
          <header class="panel-title">
            <span>Speaker Notes</span>
            <span id="notes-status" class="notes-status" aria-live="polite"></span>
            <span id="notes-hint" class="notes-hint"></span>
            <button type="button" id="toggle-notes" class="notes-toggle" title="Show speaker notes" aria-label="Show speaker notes" aria-expanded="false">
              <span class="button-icon" aria-hidden="true">▾</span>
              <span>Speaker notes</span>
            </button>
          </header>
          <textarea id="notes-body" class="notes-body" spellcheck="false" autocomplete="off" placeholder="Type notes for this slide… (saved automatically)"></textarea>
          <div class="notes-actions">
            <button type="button" id="export-notes" class="btn">Export speaker note</button>
            <button type="button" id="load-notes" class="btn">Load speaker note</button>
            <input type="file" id="load-notes-input" accept="application/json,.json" hidden />
            <div id="notes-action-status" class="notes-action-status" aria-live="polite"></div>
          </div>
          <div class="record-panel">
            <div class="record-header">
              <span class="record-indicator" id="record-indicator" aria-hidden="true"></span>
              <span class="record-label" id="record-label">Audio</span>
              <span class="record-elapsed" id="record-elapsed">00:00</span>
            </div>
            <div class="record-buttons">
              <button type="button" id="record-start" class="btn btn-record">● Start</button>
              <button type="button" id="record-pause" class="btn" disabled>Pause</button>
              <button type="button" id="record-stop" class="btn" disabled>Stop</button>
            </div>
          </div>
        </section>
      </div>
      <div class="divider-col" id="divider-col" role="separator" aria-orientation="vertical" aria-label="Resize columns"></div>
      <div class="col col-right">
        <section class="next">
          <header class="panel-title">Next</header>
          <div class="canvas-wrap"><canvas id="next-canvas"></canvas></div>
        </section>
        <div class="divider-row" id="divider-row-right" role="separator" aria-orientation="horizontal" aria-label="Resize right column rows"></div>
        <section class="meta">
          <div class="meta-top">
            <div class="timer-row">
              <button type="button" id="timer" class="timer" title="Click to pause / resume (R to reset)" aria-label="Timer — click to pause or resume">00:00</button>
              <button type="button" id="timer-reset" class="timer-reset" title="Reset timer (R)" aria-label="Reset timer">↺</button>
              <span class="slide-timer" title="Time on current slide"><span class="slide-timer-label">Slide</span><span id="slide-timer-value" aria-label="Time on current slide">00:00</span></span>
              <button type="button" id="slide-timer-reset" class="timer-reset" title="Reset slide timer" aria-label="Reset slide timer">↺</button>
            </div>
            <div class="slide-status">
              <span class="counter" id="counter">– / –</span>
              <span class="pdf-name" id="pdf-name" title=""></span>
            </div>
          </div>
          <div class="meta-actions">
            <a id="back-to-list" class="btn hidden" href="/list">← All PDFs</a>
            <button type="button" id="open-pdf" class="btn hidden">Open PDF</button>
            <input type="file" id="open-pdf-input" accept="application/pdf,.pdf" hidden />
            <button type="button" id="grid-btn" class="btn" title="Show slide grid (G)" aria-label="Show slide grid"><span class="button-icon" aria-hidden="true">▦</span><span>Grid</span></button>
            <button type="button" id="open-audience" class="btn" title="Open audience view (new tab)" aria-label="Open audience view"><span class="button-icon" aria-hidden="true">↗</span><span>Audience</span></button>
            <button type="button" id="stop-presenting" class="btn hidden" title="End the presentation: audience screens show the waiting page and close">Stop presenting</button>
            <button type="button" id="update-btn" class="btn btn-primary hidden">Update</button>
          </div>
          <div class="tool-section">
            <div class="control-label">Tools</div>
            <div class="drawing-tools" role="toolbar" aria-label="Drawing tools">
              <button type="button" class="btn tool-btn active" data-tool="link" aria-label="Link" title="Link" aria-pressed="true">
                <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V5a2 2 0 0 1 4 0v4h1V3a2 2 0 1 1 4 0v6h1V5a2 2 0 1 1 4 0v9c0 4-3 7-7 7h-2c-2 0-3-1-4-2l-4-5a2 2 0 0 1 3-3l2 2Z" /></svg>
              </button>
              <div class="drawing-tool-group">
                <button type="button" class="btn tool-btn" data-tool="pen" aria-label="Pen" title="Pen" aria-pressed="false">
                  <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z" /><path d="m13.5 7.5 3 3" /><path d="M4 20h5" /></svg>
                </button>
                <div class="color-swatches" role="group" aria-label="Pen color">
                  <button type="button" class="color-swatch active" data-color-target="pen" data-color="#2563eb" aria-label="Blue pen" aria-pressed="true" style="--swatch-color: #2563eb"></button>
                  <button type="button" class="color-swatch" data-color-target="pen" data-color="#111827" aria-label="Black pen" aria-pressed="false" style="--swatch-color: #111827"></button>
                  <button type="button" class="color-swatch" data-color-target="pen" data-color="#dc2626" aria-label="Red pen" aria-pressed="false" style="--swatch-color: #dc2626"></button>
                  <button type="button" class="color-swatch" data-color-target="pen" data-color="#16a34a" aria-label="Green pen" aria-pressed="false" style="--swatch-color: #16a34a"></button>
                </div>
              </div>
              <button type="button" class="btn tool-btn" data-tool="eraser" aria-label="Eraser" title="Eraser" aria-pressed="false">
                <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-3.5-3.5a2.1 2.1 0 0 1 0-3L13.5 4.5a2.1 2.1 0 0 1 3 0l3 3a2.1 2.1 0 0 1 0 3L11 21H7Z" /><path d="m14 14 4 4" /><path d="M11 21h9" /></svg>
              </button>
              <div class="drawing-tool-group">
                <button type="button" class="btn tool-btn" data-tool="laser" aria-label="Laser pointer" title="Laser pointer" aria-pressed="false">
                  <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 19 8-8" /><path d="m3 21 3-3" /><path d="m13 11 2 2" /><circle cx="18" cy="6" r="3" /><path d="M18 1v2M18 9v2M13 6h2M21 6h2" /></svg>
                </button>
                <div class="color-swatches" role="group" aria-label="Laser color">
                  <button type="button" class="color-swatch active" data-color-target="laser" data-color="#2563eb" aria-label="Blue laser" aria-pressed="true" style="--swatch-color: #2563eb"></button>
                  <button type="button" class="color-swatch" data-color-target="laser" data-color="#dc2626" aria-label="Red laser" aria-pressed="false" style="--swatch-color: #dc2626"></button>
                  <button type="button" class="color-swatch" data-color-target="laser" data-color="#16a34a" aria-label="Green laser" aria-pressed="false" style="--swatch-color: #16a34a"></button>
                </div>
              </div>
            </div>
          </div>
          <div class="slide-control-panel">
            <div class="control-label">Slide</div>
            <div class="slide-controls" role="toolbar" aria-label="Slide controls">
              <div class="control-group">
                <button type="button" id="prev-slide" class="icon-btn" title="Previous slide" aria-label="Previous slide"><span aria-hidden="true">◀</span></button>
                <button type="button" id="next-slide" class="icon-btn" title="Next slide" aria-label="Next slide"><span aria-hidden="true">▶</span></button>
              </div>
              <div class="control-group zoom-group">
                <button type="button" id="zoom-out" class="icon-btn" title="Zoom out" aria-label="Zoom out"><span aria-hidden="true">−</span></button>
                <button type="button" id="zoom-reset" class="zoom-level" title="Reset zoom" aria-label="Reset zoom">100%</button>
                <button type="button" id="zoom-in" class="icon-btn" title="Zoom in" aria-label="Zoom in"><span aria-hidden="true">+</span></button>
              </div>
            </div>
          </div>
          <div class="hints">
            <span>← →</span> nav
            <span>G</span> grid
            <span>F</span> freeze
            <span>B</span> black
            <span>R</span> reset timer
          </div>
        </section>
      </div>
    </div>

    <div id="record-dialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="record-dialog-title">
      <div class="modal-card">
        <h2 id="record-dialog-title" class="modal-title">Save recording?</h2>
        <dl class="modal-info">
          <dt>File</dt>
          <dd id="record-dialog-file">—</dd>
          <dt>Slides</dt>
          <dd id="record-dialog-range">—</dd>
          <dt>Duration</dt>
          <dd id="record-dialog-duration">—</dd>
          <dt>Size</dt>
          <dd id="record-dialog-size">—</dd>
          <dt>Segments</dt>
          <dd>
            <ul id="record-dialog-segments" class="segment-list"></ul>
          </dd>
        </dl>
        <div id="record-dialog-error" class="modal-error hidden"></div>
        <div class="modal-actions">
          <button type="button" id="record-dialog-abandon" class="btn">Abandon</button>
          <button type="button" id="record-dialog-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
    <script type="module">
      import { initPresenter } from "/assets/presenter.js";
      initPresenter();
    </script>
  </body>
</html>
